<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeTrack</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <h1>CodeTrack</h1>
    <p>Organize seus estudos de programação.</p>

    <section class="stats">
      <h2 id="level">Nível 1</h2>

      <p id="xp">0 / 100 XP</p>

      <div class="progress-bar">
        <div id="xpBar" class="progress"></div>
      </div>
    </section>

    <section class="dashboard">

      <div class="stat-card">
        <h3>Total</h3>
        <p id="totalTasks">0</p>
      </div>

      <div class="stat-card">
        <h3>Concluídas</h3>
        <p id="completedTasks">0</p>
      </div>

      <div class="stat-card">
        <h3>Pendentes</h3>
        <p id="pendingTasks">0</p>
      </div>

      <div class="stat-card">
        <h3>Progresso</h3>
        <p id="progressPercentage">0%</p>
      </div>

    </section>

    <section class="task-form">

      <h2>Adicionar tarefa</h2>

      <input
        type="text"
        id="technology"
        placeholder="Tecnologia: (ex: JavaScript)"
      >

      <input
        type="text"
        id="task"
        placeholder="Tarefa: (ex: Estudar arrays)"
      >

      <select id="priority">
        <option value="low">Baixa prioridade</option>
        <option value="medium" selected>Média prioridade</option>
        <option value="high">Alta prioridade</option>
      </select>

      <input
        type="date"
        id="dueDate"
      >

      <button id="addTask">
        Adicionar
      </button>

    </section>

    <section>

      <h2>Minhas tarefas</h2>

      <input
        type="text"
        id="searchTask"
        placeholder="Buscar tarefa ou tecnologia..."
      >

      <select id="sortTasks">
        <option value="default">Ordenação padrão</option>
        <option value="priority">Ordenar por prioridade</option>
      </select>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>

      <ul id="taskList"></ul>

    </section>

  </main>

  <script src="js/app.js"></script>

</body>
</html>
